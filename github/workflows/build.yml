name: Build ApexPip AI v3.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ApexPip AI v3.0
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. Check Twelve Data API key
      # --------------------------------------------------
      - name: Check Twelve Data API key
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "ERROR: TWELVE_DATA_API_KEY secret is missing."
            exit 1
          fi
          echo "Twelve Data API key detected."

      # --------------------------------------------------
      # 3. Extract Android project
      # --------------------------------------------------
      - name: Extract Android project
        run: |
          rm -rf app_project
          mkdir -p app_project

          if [ ! -f "PipPilotAI_Android_Project.zip" ]; then
            echo "ERROR: PipPilotAI_Android_Project.zip not found."
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          unzip -o PipPilotAI_Android_Project.zip -d app_project

          echo "Extracted project:"
          find app_project -maxdepth 4 -type f | sort | head -200

      # --------------------------------------------------
      # 4. Find Android project
      # --------------------------------------------------
      - name: Locate Android project
        id: locate
        run: |
          GRADLE_FILE=$(find app_project -type f -path "*/app/build.gradle" | head -1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: app/build.gradle not found."
            find app_project -type f | sort
            exit 1
          fi

          APP_DIR=$(dirname "$(dirname "$GRADLE_FILE")")

          echo "GRADLE_FILE=$GRADLE_FILE" >> "$GITHUB_OUTPUT"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle file: $GRADLE_FILE"
          echo "Android project: $APP_DIR"

      # --------------------------------------------------
      # 5. Configure Android project
      # --------------------------------------------------
      - name: Configure Android project
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          APP_DIR="${{ steps.locate.outputs.APP_DIR }}"
          GRADLE_FILE="${{ steps.locate.outputs.GRADLE_FILE }}"

          echo "Using:"
          echo "$APP_DIR"
          echo "$GRADLE_FILE"

          # -----------------------------------------------
          # Add OkHttp dependency if it does not exist
          # -----------------------------------------------
          if ! grep -q "com.squareup.okhttp3:okhttp" "$GRADLE_FILE"; then
            python3 - "$GRADLE_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          dependency = "implementation 'com.squareup.okhttp3:okhttp:4.12.0'"

          if "dependencies {" in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {\n    " + dependency,
                  1
              )
          else:
              text += "\n\ndependencies {\n    " + dependency + "\n}\n"

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY
          fi

          # -----------------------------------------------
          # Enable BuildConfig
          # -----------------------------------------------
          if ! grep -q "buildFeatures" "$GRADLE_FILE"; then
            cat >> "$GRADLE_FILE" <<'EOF'

          android {
              buildFeatures {
                  buildConfig true
              }
          }
          EOF
          fi

          # -----------------------------------------------
          # Java 17 / Kotlin 17
          # -----------------------------------------------
          cat >> "$GRADLE_FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          # -----------------------------------------------
          # Twelve Data API key
          # -----------------------------------------------
          cat >> "$GRADLE_FILE" <<'EOF'

          android {
              defaultConfig {
                  buildConfigField "String", "TWELVE_DATA_API_KEY", "\"PLACEHOLDER_API_KEY\""
              }
          }
          EOF

          # Replace placeholder with GitHub secret
          python3 - "$GRADLE_FILE" "$TWELVE_DATA_API_KEY" <<'PY'
          import sys

          path = sys.argv[1]
          api_key = sys.argv[2]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = text.replace(
              '"PLACEHOLDER_API_KEY"',
              '"' + api_key.replace('\\', '\\\\').replace('"', '\\"') + '"'
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          # -----------------------------------------------
          # AndroidManifest
          # -----------------------------------------------
          MANIFEST=$(find "$APP_DIR" -name AndroidManifest.xml | head -1)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Manifest: $MANIFEST"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            python3 - "$MANIFEST" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = text.replace(
              "<manifest",
              "<manifest\n    <uses-permission android:name=\"android.permission.INTERNET\" />",
              1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY
          fi

          # -----------------------------------------------
          # Create premium background
          # -----------------------------------------------
          mkdir -p "$APP_DIR/src/main/res/drawable"

          cat > "$APP_DIR/src/main/res/drawable/apexpip_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <gradient
                  android:angle="270"
                  android:startColor="#05070D"
                  android:centerColor="#0B1220"
                  android:endColor="#020308" />

          </shape>
          EOF

          # -----------------------------------------------
          # Create robot icon
          # -----------------------------------------------
          mkdir -p "$APP_DIR/src/main/res/drawable"

          cat > "$APP_DIR/src/main/res/drawable/ic_apexpip_robot.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#111827"
                  android:pathData="M18,28 L90,28 L90,80 L18,80 Z" />

              <path
                  android:fillColor="#1FE68A"
                  android:pathData="M30,43 L43,43 L43,56 L30,56 Z" />

              <path
                  android:fillColor="#1FE68A"
                  android:pathData="M65,43 L78,43 L78,56 L65,56 Z" />

              <path
                  android:fillColor="#B8C4D6"
                  android:pathData="M39,68 L69,68 L69,74 L39,74 Z" />

              <path
                  android:fillColor="#8C9AAD"
                  android:pathData="M49,18 L59,18 L59,28 L49,28 Z" />

              <path
                  android:fillColor="#1FE68A"
                  android:pathData="M51,11 L57,11 L57,18 L51,18 Z" />

          </vector>
          EOF

          # -----------------------------------------------
          # Update manifest icon
          # -----------------------------------------------
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/ic_apexpip_robot"/g' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/ic_apexpip_robot"/g' "$MANIFEST"

          echo "Android project configured."

      # --------------------------------------------------
      # 6. Replace MainActivity with live Twelve Data feed
      # --------------------------------------------------
      - name: Create ApexPip AI MainActivity
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          APP_DIR="${{ steps.locate.outputs.APP_DIR }}"

          MAIN_ACTIVITY=$(find "$APP_DIR/src/main/java" "$APP_DIR/src/main/kotlin" \
            -type f -name "MainActivity.kt" 2>/dev/null | head -1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt not found."
            find "$APP_DIR/src/main" -type f | sort
            exit 1
          fi

          echo "MainActivity: $MAIN_ACTIVITY"

          PACKAGE_NAME=$(grep -m1 '^package ' "$MAIN_ACTIVITY" | sed 's/package //' | tr -d '\r')

          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.pippilot.ai"
          fi

          echo "Package: $PACKAGE_NAME"

          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE_NAME

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import org.json.JSONObject

          class MainActivity : Activity() {

              private lateinit var priceText: TextView
              private lateinit var statusText: TextView
              private lateinit var signalText: TextView
              private lateinit var symbolText: TextView
              private lateinit var timeText: TextView

              private val client = OkHttpClient()
              private var webSocket: WebSocket? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  buildInterface()
                  connectToMarket()
              }

              private fun buildInterface() {

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(28, 40, 28, 28)
                  root.gravity = Gravity.CENTER_HORIZONTAL
                  root.setBackgroundColor(Color.rgb(5, 7, 13))

                  val title = TextView(this)
                  title.text = "APEXPIP AI"
                  title.textSize = 30f
                  title.setTextColor(Color.rgb(31, 230, 138))
                  title.gravity = Gravity.CENTER
                  title.setTypeface(null, android.graphics.Typeface.BOLD)

                  val creator = TextView(this)
                  creator.text = "Made by Thabiso Khutlane"
                  creator.textSize = 14f
                  creator.setTextColor(Color.LTGRAY)
                  creator.gravity = Gravity.CENTER

                  symbolText = TextView(this)
                  symbolText.text = "EUR/USD"
                  symbolText.textSize = 24f
                  symbolText.setTextColor(Color.WHITE)
                  symbolText.gravity = Gravity.CENTER
                  symbolText.setPadding(0, 40, 0, 10)

                  statusText = TextView(this)
                  statusText.text = "CONNECTING TO LIVE MARKET..."
                  statusText.textSize = 15f
                  statusText.setTextColor(Color.YELLOW)
                  statusText.gravity = Gravity.CENTER

                  priceText = TextView(this)
                  priceText.text = "--.-----"
                  priceText.textSize = 42f
                  priceText.setTextColor(Color.WHITE)
                  priceText.gravity = Gravity.CENTER
                  priceText.setPadding(0, 35, 0, 35)

                  signalText = TextView(this)
                  signalText.text = "WAITING FOR LIVE DATA"
                  signalText.textSize = 20f
                  signalText.setTextColor(Color.rgb(31, 230, 138))
                  signalText.gravity = Gravity.CENTER
                  signalText.setPadding(0, 20, 0, 20)

                  timeText = TextView(this)
                  timeText.text = "Live feed initializing..."
                  timeText.textSize = 13f
                  timeText.setTextColor(Color.GRAY)
                  timeText.gravity = Gravity.CENTER

                  root.addView(title)
                  root.addView(creator)
                  root.addView(symbolText)
                  root.addView(statusText)
                  root.addView(priceText)
                  root.addView(signalText)
                  root.addView(timeText)

                  setContentView(root)
              }

              private fun connectToMarket() {

                  val apiKey = BuildConfig.TWELVE_DATA_API_KEY

                  if (apiKey.isBlank() || apiKey == "PLACEHOLDER_API_KEY") {
                      statusText.text = "API KEY NOT CONFIGURED"
                      signalText.text = "CHECK GITHUB SECRET"
                      return
                  }

                  val request = Request.Builder()
                      .url("wss://ws.twelvedata.com/v1/quotes/price?apikey=\$apiKey")
                      .build()

                  webSocket = client.newWebSocket(
                      request,
                      object : WebSocketListener() {

                          override fun onOpen(
                              webSocket: WebSocket,
                              response: okhttp3.Response
                          ) {
                              runOnUiThread {
                                  statusText.text = "● LIVE MARKET DATA"
                                  statusText.setTextColor(
                                      Color.rgb(31, 230, 138)
                                  )
                              }

                              val subscribe = JSONObject()
                              subscribe.put("action", "subscribe")

                              val params = JSONObject()
                              params.put("symbols", "EUR/USD")
                              subscribe.put("params", params)

                              webSocket.send(subscribe.toString())
                          }

                          override fun onMessage(
                              webSocket: WebSocket,
                              text: String
                          ) {
                              try {
                                  val json = JSONObject(text)

                                  if (json.optString("event") == "price") {

                                      val price = json.optDouble(
                                          "price",
                                          0.0
                                      )

                                      if (price > 0) {
                                          runOnUiThread {
                                              priceText.text =
                                                  String.format(
                                                      java.util.Locale.US,
                                                      "%.5f",
                                                      price
                                                  )

                                              signalText.text =
                                                  "LIVE DATA — ANALYSIS PENDING"

                                              timeText.text =
                                                  "Real-time EUR/USD tick received"
                                          }
                                      }
                                  }

                                  if (
                                      json.optString("event") ==
                                      "subscribe-status"
                                  ) {
                                      runOnUiThread {
                                          statusText.text =
                                              "● EUR/USD STREAM ACTIVE"
                                      }
                                  }

                              } catch (_: Exception) {
                              }
                          }

                          override fun onFailure(
                              webSocket: WebSocket,
                              t: Throwable,
                              response: okhttp3.Response?
                          ) {
                              runOnUiThread {
                                  statusText.text =
                                      "LIVE CONNECTION FAILED"

                                  statusText.setTextColor(Color.RED)

                                  signalText.text =
                                      "RECONNECTING..."
                              }

                              android.os.Handler(
                                  android.os.Looper.getMainLooper()
                              ).postDelayed(
                                  {
                                      connectToMarket()
                                  },
                                  5000
                              )
                          }

                          override fun onClosed(
                              webSocket: WebSocket,
                              code: Int,
                              reason: String
                          ) {
                              runOnUiThread {
                                  statusText.text =
                                      "MARKET CONNECTION CLOSED"
                              }
                          }
                      }
                  )
              }

              override fun onDestroy() {
                  super.onDestroy()
                  webSocket?.close(1000, "App closed")
                  client.dispatcher.executorService.shutdown()
              }
          }
          EOF

      # --------------------------------------------------
      # 7. Set up Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 8. Set up Gradle 8.9
      # --------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      # --------------------------------------------------
      # 9. Show tool versions
      # --------------------------------------------------
      - name: Check build tools
        run: |
          java -version
          gradle --version

      # --------------------------------------------------
      # 10. Build APK
      # --------------------------------------------------
      - name: Build ApexPip AI APK
        working-directory: ${{ steps.locate.outputs.APP_DIR }}
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # --------------------------------------------------
      # 11. Find APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          echo "Searching for APK..."

          find "${{ steps.locate.outputs.APP_DIR }}" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "${{ steps.locate.outputs.APP_DIR }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p release

          cp "$APK" "release/ApexPip-AI-v3.0.apk"

          ls -lh release/ApexPip-AI-v3.0.apk

      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload ApexPip AI APK
        uses: actions/upload-artifact@v7
        with:
          name: ApexPip-AI-v3.0
          path: release/ApexPip-AI-v3.0.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 13. Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.0 >/dev/null 2>&1; then
            echo "Release v3.0 already exists."
            gh release upload \
              v3.0 \
              release/ApexPip-AI-v3.0.apk \
              --clobber
          else
            gh release create \
              v3.0 \
              release/ApexPip-AI-v3.0.apk \
              --title "ApexPip AI v3.0" \
              --notes "ApexPip AI v3.0 - Real-Time Forex Intelligence"
          fi
