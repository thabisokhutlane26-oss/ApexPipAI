name: Build ApexPipAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        shell: bash
        run: |
          echo "Searching for Android project ZIP..."

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          echo "Extracting Android project..."

          rm -rf android_project
          mkdir -p android_project

          unzip -o "$ZIP_FILE" -d android_project

          echo ""
          echo "Extracted project files:"
          find android_project -maxdepth 6 -type f \
            -not -path "*/.gradle/*" \
            | sort | head -500

      - name: Locate Gradle project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find android_project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Generating Gradle wrapper..."

          gradle wrapper \
            --gradle-version 8.10 \
            --distribution-type bin

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper generated successfully."

      - name: Find MainActivity.kt
        shell: bash
        run: |
          echo "Searching for MainActivity.kt..."

          MAIN_ACTIVITY=$(find "$PROJECT_DIR" \
            -type f \
            -name "MainActivity.kt" \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "WARNING: MainActivity.kt was not found."

            echo ""
            echo "All Kotlin files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.kt" \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              | sort
          else
            echo "MainActivity.kt found:"
            echo "$MAIN_ACTIVITY"
          fi

      - name: Show project structure
        shell: bash
        run: |
          echo "Final Android project structure:"
          echo ""

          find "$PROJECT_DIR" -maxdepth 8 -type f \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            | sort | head -600

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --version

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR" \
              -type f \
              -not -path "*/.gradle/*" \
              | sort | tail -300

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK SUCCESSFULLY GENERATED"
          echo "======================================"
          echo "$APK"

          mkdir -p artifacts
          cp "$APK" artifacts/ApexPipAI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ApexPipAI-APK
          path: artifacts/ApexPipAI-debug.apk
          if-no-files-found: error
