name: Build ApexPipAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        shell: bash
        run: |
          echo "Searching for Android project ZIP..."

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file containing the Android project was found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          echo "Extracting Android project..."

          mkdir -p android_project

          unzip -o "$ZIP_FILE" -d android_project

          echo ""
          echo "Extracted files:"
          find android_project -maxdepth 6 -type f \
            -not -path "*/.gradle/*" \
            | sort | head -500

      - name: Locate Gradle project
        shell: bash
        run: |
          echo "Searching for gradlew..."

          GRADLEW=$(find android_project \
            -type f \
            -name "gradlew" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found after extracting the ZIP."
            echo ""
            echo "Searching for Gradle configuration files..."

            find android_project \
              -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -not -path "*/.gradle/*" \
              | sort

            echo ""
            echo "If the ZIP contains only source files and not a complete Gradle project,"
            echo "the Android project will need to be completed."

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Find MainActivity.kt
        shell: bash
        run: |
          echo "Searching for MainActivity.kt..."

          MAIN_ACTIVITY=$(find "$PROJECT_DIR" \
            -type f \
            -name "MainActivity.kt" \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "WARNING: MainActivity.kt was not found."

            echo ""
            echo "Kotlin source files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.kt" \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              | sort
          else
            echo "MainActivity.kt found:"
            echo "$MAIN_ACTIVITY"
          fi

      - name: Show Android project structure
        shell: bash
        run: |
          echo "Android project:"
          echo "$PROJECT_DIR"
          echo ""

          find "$PROJECT_DIR" -maxdepth 7 -type f \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            | sort | head -500

      - name: Check Gradle
        run: |
          "$PROJECT_DIR/gradlew" --version

      - name: Clean project
        run: |
          "$PROJECT_DIR/gradlew" clean --stacktrace

      - name: Build Debug APK
        run: |
          "$PROJECT_DIR/gradlew" assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated:"
          echo "$APK"

          mkdir -p artifacts
          cp "$APK" artifacts/ApexPipAI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ApexPipAI-APK
          path: artifacts/ApexPipAI-debug.apk
          if-no-files-found: error
