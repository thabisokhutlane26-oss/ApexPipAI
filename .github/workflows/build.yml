name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check repository structure
        run: |
          echo "Repository root:"
          pwd
          echo ""
          echo "Files and folders:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project
        working-directory: app_project
        run: |
          echo "Android project found."
          echo ""
          echo "Project contents:"
          find . -maxdepth 5 -type f \
            -not -path "./.gradle/*" \
            -not -path "./build/*" \
            | sort | head -300

      - name: Make Gradle wrapper executable
        working-directory: app_project
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found in app_project."
            echo ""
            echo "Contents of app_project:"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew

      - name: Find MainActivity.kt
        working-directory: app_project
        shell: bash
        run: |
          echo "Searching entire Android project for MainActivity.kt..."

          MAIN_ACTIVITY=$(find . \
            -type f \
            -name "MainActivity.kt" \
            -not -path "./.gradle/*" \
            -not -path "./build/*" \
            | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "WARNING: MainActivity.kt was not found."
            echo ""
            echo "Kotlin and Java source files found:"
            find . -type f \
              \( -name "*.kt" -o -name "*.java" \) \
              -not -path "./.gradle/*" \
              | sort
          else
            echo "MainActivity.kt found:"
            echo "$MAIN_ACTIVITY"

            echo "MAIN_ACTIVITY=$MAIN_ACTIVITY" >> "$GITHUB_ENV"
          fi

      - name: Check Gradle
        working-directory: app_project
        run: |
          ./gradlew --version

      - name: Clean project
        working-directory: app_project
        run: |
          ./gradlew clean --stacktrace

      - name: Build Debug APK
        working-directory: app_project
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        working-directory: app_project
        shell: bash
        run: |
          echo "Searching for APK..."

          APK=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo ""
            echo "Possible build outputs:"
            find . -type f \
              -not -path "./.gradle/*" \
              | sort | tail -200
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p ../artifacts
          cp "$APK" ../artifacts/ApexPipAI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ApexPipAI-APK
          path: artifacts/ApexPipAI-debug.apk
          if-no-files-found: error
