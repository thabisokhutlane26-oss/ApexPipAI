                      apiKey == "PLACEHOLDER_API_KEY"
                  ) {

                      statusText.text =
                          "API KEY NOT CONFIGURED"

                      statusText.setTextColor(
                          Color.RED
                      )

                      signalText.text =
                          "CHECK GITHUB SECRET"

