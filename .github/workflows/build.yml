name: Build ApexPipAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        shell: bash
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Top-level files:"
          find . -maxdepth 3 -type f | sort | head -300
          echo ""

          GRADLEW=$(find . -type f -name "gradlew" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "This repository does not appear to contain a Gradle Android project."
            echo ""
            echo "Searching for Gradle files:"
            find . -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.git/*" \
              | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android/Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project structure
        shell: bash
        run: |
          echo "Project directory: $PROJECT_DIR"
          echo ""

          find "$PROJECT_DIR" -maxdepth 6 -type f \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            | sort | head -400

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Find MainActivity.kt
        shell: bash
        run: |
          echo "Searching for MainActivity.kt..."

          MAIN_ACTIVITY=$(find "$PROJECT_DIR" \
            -type f \
            -name "MainActivity.kt" \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "WARNING: MainActivity.kt was not found."
            echo ""
            echo "Kotlin files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.kt" \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              | sort
          else
            echo "MainActivity.kt found:"
            echo "$MAIN_ACTIVITY"

            echo "MAIN_ACTIVITY=$MAIN_ACTIVITY" >> "$GITHUB_ENV"
          fi

      - name: Check Gradle
        run: |
          "$PROJECT_DIR/gradlew" --version

      - name: Clean project
        run: |
          "$PROJECT_DIR/gradlew" clean --stacktrace

      - name: Build Debug APK
        run: |
          "$PROJECT_DIR/gradlew" assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo ""
            echo "Build files:"
            find "$PROJECT_DIR" \
              -type f \
              -not -path "*/.gradle/*" \
              | sort | tail -200
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p artifacts
          cp "$APK" artifacts/ApexPipAI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ApexPipAI-APK
          path: artifacts/ApexPipAI-debug.apk
          if-no-files-found: error
