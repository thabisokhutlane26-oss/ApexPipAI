                  root.addView(symbolText)

                  statusText = titleView(
                      "CONNECTING TO LIVE MARKET...",
                      15f
                  )

                  statusText.setTextColor(
                      Color.YELLOW
                  )

                  root.addView(statusText)

                  priceText = titleView(
                      "--.-----",
                      42f
                  )

                  priceText.setPadding(
                      0,
                      35,
                      0,
                      35
                  )

                  root.addView(priceText)

                  signalText = titleView(
                      "WAITING FOR LIVE DATA",
                      20f
                  )

                  signalText.setTextColor(
                      Color.rgb(31, 230, 138)
                  )

                  signalText.setPadding(
                      0,
                      20,
                      0,
                      20
                  )

                  root.addView(signalText)

                  timeText = titleView(
                      "Live feed initializing...",
                      13f
                  )

                  timeText.setTextColor(
                      Color.GRAY
                  )

                  root.addView(timeText)

                  setContentView(root)
              }

              private fun titleView(
                  text: String,
                  size: Float
              ): TextView {

                  val view = TextView(this)

                  view.text = text
                  view.textSize = size
                  view.setTextColor(Color.WHITE)
                  view.gravity = Gravity.CENTER

                  if (size >= 24f) {
                      view.setTypeface(
                          null,
                          Typeface.BOLD
                      )
                  }

                  return view
              }

