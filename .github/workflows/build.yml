name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: app_project
        run: chmod +x gradlew

      - name: Find MainActivity.kt
        working-directory: app_project
        shell: bash
        run: |
          echo "Searching for MainActivity.kt..."

          MAIN_ACTIVITY=$(find . \
            -type f \
            -name "MainActivity.kt" \
            -not -path "./.gradle/*" \
            -not -path "./build/*" \
            | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt not found anywhere inside app_project."
            echo ""
            echo "Android source files found:"
            find . -type f \( -name "*.kt" -o -name "*.java" \) \
              -not -path "./.gradle/*" \
              | sort
            exit 1
          fi

          echo "MainActivity.kt found at:"
          echo "$MAIN_ACTIVITY"

          echo "MAIN_ACTIVITY=$MAIN_ACTIVITY" >> "$GITHUB_ENV"

      - name: Show Android project structure
        working-directory: app_project
        run: |
          echo "Project files:"
          find . -maxdepth 5 -type f \
            -not -path "./.gradle/*" \
            -not -path "./build/*" \
            | sort | head -300

      - name: Check Gradle project
        working-directory: app_project
        run: |
          echo "Gradle version:"
          ./gradlew --version

      - name: Build Debug APK
        working-directory: app_project
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        working-directory: app_project
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo ""
            echo "Build directory contents:"
            find . -type f \
              -not -path "./.gradle/*" \
              | sort | tail -200
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p ../artifacts
          cp "$APK" ../artifacts/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Android-APK
          path: artifacts/app-debug.apk
          if-no-files-found: error
